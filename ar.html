<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bring it to class · AR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<script src="ar-models.js"></script>
<style>
@font-face{font-family:'Archivo';font-style:normal;font-display:swap;font-weight:100 900;font-stretch:62% 125%;src:url(fonts/archivo-latin-standard-normal.woff2) format('woff2')}
@font-face{font-family:'Inter Tight';font-style:normal;font-display:swap;font-weight:100 900;src:url(fonts/inter-tight-latin-wght-normal.woff2) format('woff2')}
:root{--pp:#F4F3EC;--tx:#17200F;--tx2:#3A4430;--tape:#FFE843;--red:#d9381e;--tw:"Special Elite","Courier New",monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--pp);color:var(--tx);font-family:"Inter Tight",Arial,sans-serif}
body{display:flex;flex-direction:column;min-height:100svh;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
.k{font-family:var(--tw);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--red)}
h1{font-family:"Archivo",Arial Black,sans-serif;font-stretch:115%;font-weight:860;text-transform:uppercase;font-size:clamp(26px,7.5vw,52px);line-height:.95;letter-spacing:-.01em;margin:8px 0 6px}
h1 mark{background:var(--tape);color:var(--tx);padding:0 .1em}
p{font-size:15px;line-height:1.4;color:var(--tx2);max-width:560px}
model-viewer{position:relative;flex:1;width:100%;min-height:50svh;margin:12px 0;background:radial-gradient(circle at 50% 60%,#fff 0,#ecebe2 70%);border:1.5px solid var(--tx);border-radius:14px}
.go{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);font:700 17px/1 "Inter Tight",Arial,sans-serif;background:var(--tape);color:var(--tx);border:2px solid var(--tx);border-radius:999px;padding:14px 22px;box-shadow:0 3px 0 var(--tx);white-space:nowrap}
.prog{position:absolute;inset:auto 0 0 0;height:4px;background:var(--red);transform-origin:left;transform:scaleX(0);transition:transform .2s,opacity .3s}
.pick{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.pick button{flex:none;font:600 13px/1 "Inter Tight",Arial,sans-serif;background:#fff;color:var(--tx);border:1.5px solid var(--tx);border-radius:999px;padding:9px 14px}
.pick button[aria-pressed="true"]{background:var(--tx);color:#fff}
.cr{font-family:var(--tw);font-size:11px;color:#56604A;margin-top:10px}
</style>
</head>
<body>
<div class="k" id="kick">Phones out · augmented reality</div>
<h1 id="title">Pick one. <mark>Bring it to class.</mark></h1>
<p id="sub">Tap the yellow button, point at the floor or a desk, and walk around it.</p>
<model-viewer id="mv" ar ar-modes="scene-viewer quick-look webxr" ar-placement="floor" camera-controls auto-rotate autoplay shadow-intensity="1" touch-action="pan-y" loading="eager">
  <button slot="ar-button" class="go">Bring it into the room</button>
  <div class="prog" slot="progress-bar" id="prog"></div>
</model-viewer>
<div class="pick" id="pick"></div>
<p class="cr" id="cr">Works in Safari on iPhone and Chrome on Android. Big models take a few seconds.</p>
<script>
const M=window.AR_MODELS,mv=document.getElementById('mv'),prog=document.getElementById('prog'),pick=document.getElementById('pick');
mv.addEventListener('progress',e=>{prog.style.opacity=1;prog.style.transform='scaleX('+e.detail.totalProgress+')';if(e.detail.totalProgress>=1)setTimeout(()=>prog.style.opacity=0,300)});
function show(key){const m=M.find(x=>x.key===key)||M[0];
 mv.src=m.src;mv.alt=m.title;if(m.ios)mv.setAttribute('ios-src',m.ios);else mv.removeAttribute('ios-src');
 if(m.anim)mv.setAttribute('animation-name',m.anim);else mv.removeAttribute('animation-name');
 document.getElementById('kick').textContent='Phones out · '+m.tag;document.getElementById('title').innerHTML=m.title.replace(/\*(.+?)\*/,'<mark>$1</mark>');
 document.getElementById('sub').textContent=m.sub;document.getElementById('cr').textContent=(m.credit?m.credit+' · ':'')+'Works in Safari on iPhone and Chrome on Android.';
 [...pick.children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===m.key));
 try{history.replaceState(null,'','?m='+m.key)}catch(e){}}
M.forEach(m=>{const b=document.createElement('button');b.textContent=m.chip;b.dataset.k=m.key;b.onclick=()=>show(m.key);pick.appendChild(b)});
show(new URLSearchParams(location.search).get('m')||'armstrong');
</script>
</body>
</html>
